name: Auto Telegram Movie Poster

on:
  schedule:
    # Runs automatically every 10 minutes (144 times a day) non-stop
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger button in GitHub Actions tab

jobs:
  post-movie-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Global SEO Sitemap & Index
        run: node scripts/generate-sitemap.js

      - name: Run Telegram Channel Auto-Poster & Viral SEO Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/telegram-autoposter.js
