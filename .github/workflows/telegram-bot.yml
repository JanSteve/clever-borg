name: Auto Telegram Movie Poster

on:
  schedule:
    # Cron fallback heartbeat every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual 1-click trigger button in GitHub Actions tab

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-autoposter
  cancel-in-progress: true

jobs:
  post-movie-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Global SEO Sitemap & Index
        run: node scripts/generate-sitemap.js

      - name: Run Guaranteed 10-Minute Continuous Auto-Poster Loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          echo "🚀 Starting Guaranteed 10-Minute Continuous Loop..."
          # Runs 30 drops (10 mins each = 5 hours guaranteed non-stop posting)
          for i in {1..30}; do
            echo "=================================================="
            echo "📢 DISPATCHING DROP #$i at $(date -u)"
            echo "=================================================="
            node scripts/telegram-autoposter.js
            
            if [ $i -lt 30 ]; then
              echo "⏳ Waiting 10 minutes (600 seconds) for next drop..."
              sleep 600
            fi
          done
          echo "✅ Completed 5-hour continuous batch (30 drops)!"

      - name: Auto Chain-Trigger Next 5-Hour Batch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "🔄 Automatically spawning the next continuous batch..."
          gh api -X POST /repos/$REPO/actions/workflows/telegram-bot.yml/dispatches -f ref=main || echo "Next batch scheduled by cron."
