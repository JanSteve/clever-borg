name: Auto Telegram Movie Poster

on:
  schedule:
    # Auto-triggers every 3 hours to start the next 3-hour batch of 10-min drops
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual 1-click trigger button in GitHub Actions tab

jobs:
  post-movie-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Global SEO Sitemap & Index
        run: node scripts/generate-sitemap.js

      - name: Run Guaranteed 10-Minute Continuous Auto-Poster Loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          echo "🚀 Starting 10-Minute Continuous Drop Engine (18 drops over 3 hours)..."
          for i in {1..18}; do
            echo "=================================================="
            echo "📢 POSTING TELEGRAM DROP #$i at $(date -u)"
            echo "=================================================="
            node scripts/telegram-autoposter.js || true
            
            if [ $i -lt 18 ]; then
              echo "⏳ Sleeping for 10 minutes (600 seconds) until next drop..."
              sleep 600
            fi
          done
          echo "✅ Completed 3-hour continuous drop batch (18 posts)!"
